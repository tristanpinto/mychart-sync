[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mychart-sync"
version = "0.1.0"
description = "Download MyChart and Tidepool records as local Markdown and JSON"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]

[project.scripts]
mychart-sync = "health_sync.cli:main"
health-sync = "health_sync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/health_sync"]
